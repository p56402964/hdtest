[package]
name = "evm-blockwise-extractor"
version = "2.5.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
flate2 = "1.0"
csv = "1.3"
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
